<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Keeper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #2a2a2a;
            border-radius: 12px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #4CAF50;
            font-size: 28px;
        }

        .section {
            background: #333;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 14px;
            color: #999;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
            font-size: 14px;
        }

        .bpm-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .bpm-control input {
            flex: 1;
            background: #444;
            border: 1px solid #555;
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            font-size: 16px;
            text-align: center;
        }

        .bpm-control button {
            width: 40px;
            height: 40px;
            background: #4CAF50;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .bpm-control button:hover {
            background: #45a049;
        }

        .time-signature {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .time-signature input {
            width: 60px;
            background: #444;
            border: 1px solid #555;
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            font-size: 16px;
            text-align: center;
        }

        .time-signature span {
            font-size: 24px;
            color: #999;
        }

        .note-options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .note-option {
            flex: 1;
            min-width: 80px;
        }

        .note-option input[type="radio"] {
            display: none;
        }

        .note-option label {
            display: block;
            background: #444;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            margin: 0;
        }

        .note-option input[type="radio"]:checked + label {
            background: #4CAF50;
            color: #fff;
        }

        .note-option label:hover {
            background: #555;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-start {
            background: #4CAF50;
            color: #fff;
        }

        .btn-start:hover {
            background: #45a049;
        }

        .btn-stop {
            background: #f44336;
            color: #fff;
        }

        .btn-stop:hover {
            background: #da190b;
        }

        .beat-indicator {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 30px 0;
        }

        .beat {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #444;
            transition: all 0.1s;
        }

        .beat.active {
            background: #4CAF50;
            box-shadow: 0 0 20px #4CAF50;
            transform: scale(1.2);
        }

        .beat.first {
            border: 2px solid #4CAF50;
        }

        .detection-result {
            text-align: center;
        }

        .note-display {
            font-size: 48px;
            font-weight: bold;
            color: #4CAF50;
            margin-bottom: 10px;
        }

        .cents-display {
            font-size: 18px;
            color: #999;
            margin-bottom: 20px;
        }

        .timing-display {
            font-size: 20px;
            padding: 10px;
            border-radius: 6px;
            background: #444;
        }

        .timing-display.on-beat {
            background: #4CAF50;
            color: #fff;
        }

        .timing-display.off-beat {
            background: #f44336;
            color: #fff;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background-color: #ccc;
        }

        button:enabled {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <script src="https://cdn.socket.io/4.6.0/socket.io.min.js" integrity="sha384-c79GN5VsunZvi+Q/WObgk2in0CbZsHnjEqvFxC5DxHn9lTfNce2WW6h2pH6u/kF+" crossorigin="anonymous"></script>
    
    <div class="container">
        <h1>Time Keeper</h1>

        <div class="section">
            <div class="section-title">Settings</div>
            
            <div class="control-group">
                <label>BPM</label>
                <div class="bpm-control">
                    <button onclick="changeBPM(-1)">-</button>
                    <input type="number" id="bpm" value="120" min="40" max="240">
                    <button onclick="changeBPM(1)">+</button>
                </div>
            </div>

            <div class="control-group">
                <label>박자</label>
                <div class="time-signature">
                    <input type="number" id="beatTop" value="4" min="1" max="16">
                    <span>/</span>
                    <input type="number" id="beatBottom" value="4" min="1" max="16">
                </div>
            </div>

            <div class="control-group">
                <label>음표</label>
                <div class="note-options">
                    <div class="note-option">
                        <input type="radio" name="note" id="note4" value="4">
                        <label for="note4">4분음표</label>
                    </div>
                    <div class="note-option">
                        <input type="radio" name="note" id="note8" value="8" checked>
                        <label for="note8">8분음표</label>
                    </div>
                    <div class="note-option">
                        <input type="radio" name="note" id="note16" value="16">
                        <label for="note16">16분음표</label>
                    </div>
                    <div class="note-option">
                        <input type="radio" name="note" id="note32" value="32">
                        <label for="note32">32분음표</label>
                    </div>
                </div>
            </div>

            <div class="controls">
                <button class="btn btn-start" onclick="start()">Start</button>
                <button class="btn btn-stop" onclick="stop()" disabled>Stop</button>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Beat Indicator</div>
            <div class="beat-indicator" id="beatIndicator">
                <div class="beat first active"></div>
                <div class="beat"></div>
                <div class="beat"></div>
                <div class="beat"></div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Detection Result</div>
            <div class="detection-result">
                <!-- <div class="note-display" id="noteDisplay">--</div> -->
                <!-- <div class="cents-display" id="centsDisplay">-- cents</div> -->
                <div class="timing-display" id="timingDisplay">Waiting...</div>
            </div>
        </div>
    </div>

    <script>
        // Socket.IO 연결
        const socket = io();

        function changeBPM(delta) {
            const bpmInput = document.getElementById('bpm');
            let value = parseInt(bpmInput.value) + delta;
            value = Math.max(40, Math.min(240, value));
            bpmInput.value = value;
        }

        function start() {

            // 버튼 상태 변경
            document.querySelector('.btn-start').disabled = true;
            document.querySelector('.btn-stop').disabled = false;

            const settings = {
                bpm: parseInt(document.getElementById('bpm').value),
                beatTop: parseInt(document.getElementById('beatTop').value),
                beatBottom: parseInt(document.getElementById('beatBottom').value),
                noteValue: parseInt(document.querySelector('input[name="note"]:checked').value)
            };
            
            console.log('Start practice with settings:', settings);
            
            // 비트 인디케이터 생성
            createBeatIndicator(settings.beatTop);
            
            socket.emit('start', settings);
        }

        function stop() {

            // 버튼 상태 변경
            document.querySelector('.btn-start').disabled = false;
            document.querySelector('.btn-stop').disabled = true;

            // Beat indicator 초기화 (모든 불 끄기)
            const beats = document.querySelectorAll('.beat');
            beats.forEach(beat => {
                beat.classList.remove('active');
            });
            
            // Timing display 초기화
            const timingDisplay = document.getElementById('timingDisplay');
            timingDisplay.textContent = 'Waiting...';
            timingDisplay.className = 'timing-display';

            console.log('Stop practice');
            socket.emit('stop');
        }

        // 서버로부터 업데이트 받기
        socket.on('beat_update', (data) => {
            updateBeatIndicator(data.currentBeat, data.totalBeats);
        });

        socket.on('detection_update', (data) => {
            updateDetection(data.onBeat);
        });

        // 비트 인디케이터 생성
        function createBeatIndicator(beatCount) {
            const container = document.getElementById('beatIndicator');
            container.innerHTML = '';
            
            for (let i = 0; i < beatCount; i++) {
                const beat = document.createElement('div');
                beat.className = i === 0 ? 'beat first' : 'beat';
                container.appendChild(beat);
            }
        }

        // 박자 인디케이터 업데이트 예시
        function updateBeatIndicator(currentBeat, totalBeats) {
            const beats = document.querySelectorAll('.beat');
            beats.forEach((beat, index) => {
                beat.classList.remove('active');
                if (index === currentBeat) {
                    beat.classList.add('active');
                }
            });
        }

        // 검출 결과 업데이트 예시
        function updateDetection(onBeat) {
            // document.getElementById('noteDisplay').textContent = note;
            // document.getElementById('centsDisplay').textContent = `${cents > 0 ? '+' : ''}${cents} cents`;
            console.log('Detection update - On beat:', onBeat);
            const timingDisplay = document.getElementById('timingDisplay');
            if (onBeat) {
                timingDisplay.textContent = '✓ On beat';
                timingDisplay.className = 'timing-display on-beat';
            } else {
                timingDisplay.textContent = '✗ Off beat';
                timingDisplay.className = 'timing-display off-beat';
            }
        }

        // 박자 설정 변경 시 인디케이터 미리보기
        document.getElementById('beatTop').addEventListener('change', function() {
            const beatCount = parseInt(this.value);
            createBeatIndicator(beatCount);
        });

        // 페이지 로드 시 초기 인디케이터 생성
        window.addEventListener('DOMContentLoaded', function() {
            const beatTop = parseInt(document.getElementById('beatTop').value);
            createBeatIndicator(beatTop);
        });

        // 테스트용
        // setInterval(() => {
        //     const beat = Math.floor(Math.random() * 4);
        //     updateBeatIndicator(beat, 4);
        // }, 500);
    </script>
</body>
</html>
